permissions:
  contents: read

concurrency:
  group: ec-panel-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ec-quality:
    name: Manual funnel, history and metrics (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify tracked audit inputs
        shell: bash
        run: |
          git ls-files --error-unmatch \
            .env.example \
            AGENTS.md \
            public/qr.html \
            public/leads-window.html \
            public/funnel-metrics.html \
            public/panel-intelligence/customer-data-normalizer.js \
            public/panel-intelligence/conversation-data-extractor.js \
            public/panel-intelligence/agency-catalog.js \
            public/panel-intelligence/customer-form-intelligence.js \
            public/panel-intelligence/manual-funnel-policy.js \
            public/panel-intelligence/customer-order-policy.js \
            src/routes/funnelMetrics.js \
            src/routes/orders.js \
            src/routes/zapi.js \
            src/routes/whatsapp.js \
            src/models/CallAutoReplyState.js \
            src/models/ContactState.js \
            src/models/Order.js \
            src/services/callAutoReplyPolicy.js \
            src/services/callAutoReplySafetyService.js \
            src/services/droppiEcuadorService.js \
            src/services/funnelMetricsService.js \
            src/services/panelCallDropiSafetyFreezeRuntimeGuardV21.js \
            src/services/panelReadStateService.js \
            src/services/texUltraEntryGreetingService.js \
            src/services/texUltraEntryUnreadFreezeRuntimeGuardV22.js \
            src/services/ecAnaIdentityFreezeRuntimeGuardV23.js \
            src/services/buyLaterDateReminderFreezeRuntimeGuardV24.js \
            src/services/texUltraEntryInterruptFreezeRuntimeGuardV25.js \
            src/services/texUltraStrongIntentFreezeRuntimeGuardV26.js \
            src/services/texUltraVslPayloadFreezeRuntimeGuardV27.js \
            src/services/customerDataResolutionFreezeRuntimeGuardV28.js \
            src/services/customerDataResolutionService.js \
            src/services/adminBuyLaterFollowupService.js \
            src/services/buyLaterConfirmationService.js \
            src/services/agentProfiles.js \
            src/services/aiRouter.js \
            src/services/audioService.js \
            src/services/audioTemplateService.js \
            src/services/conversationEngine.js \
            src/services/nitrixFastStateService.js \
            src/services/nitrixProductProfile.js \
            src/services/openaiService.js \
            src/services/passiveFunnelObserverService.js \
            src/services/shipmentMessageService.js \
            src/services/schedulerService.js \
            src/services/vitPowerAudioComplementService.js \
            src/services/vitPowerEvolvedWorkflow.js \
            src/services/texUltraFunnelService.js \
            src/services/texUltraInitialLayerService.js \
            src/services/texUltraProductProfile.js \
            src/whatsapp/connection.js \
            scripts/guard-panel-call-dropi-safety-v21.mjs \
            scripts/assert-tex-ultra-entry-audio-approved-v22.mjs \
            scripts/guard-tex-ultra-entry-unread-v22.mjs \
            scripts/assert-ec-ana-media-approved-v23.mjs \
            scripts/audit-ec-ana-identity.mjs \
            scripts/audit-ec-nitrix-guard.mjs \
            scripts/guard-ec-ana-identity-v23.mjs \
            scripts/guard-buy-later-date-reminder-v24.mjs \
            scripts/assert-tex-ultra-entry-interrupt-approved-v25.mjs \
            scripts/guard-tex-ultra-entry-interrupt-v25.mjs \
            scripts/assert-tex-ultra-strong-intent-approved-v26.mjs \
            scripts/guard-tex-ultra-strong-intent-v26.mjs \
            scripts/assert-tex-ultra-vsl-payload-approved-v27.mjs \
            scripts/guard-tex-ultra-vsl-payload-v27.mjs \
            scripts/assert-customer-data-resolution-approved-v28.mjs \
            scripts/guard-customer-data-resolution-v28.mjs \
            scripts/plan-2800-failover-rescue.mjs \
            scripts/guard-tex-ultra-approved-v5.mjs \
            scripts/guard-order-public-product-integrity-v20.mjs \
            tests/funnel-metrics-route.test.mjs \
            tests/funnel-metrics-service.test.mjs \
            tests/manual-quick-funnel.test.cjs \
            tests/order-public-product-integrity-v20.test.mjs \
            tests/panel-call-dropi-safety.test.mjs \
            tests/panel-call-dropi-safety-v21.test.mjs \
            tests/tex-ultra-entry-unread-v22.test.mjs \
            tests/ec-ana-identity-v23.test.mjs \
            tests/buy-later-date-reminder-v24.test.mjs \
            tests/tex-ultra-entry-interrupt-v25.test.mjs \
            tests/tex-ultra-strong-intent-v26.test.mjs \
            tests/tex-ultra-vsl-payload-v27.test.mjs \
            tests/customer-data-resolution-v28.test.mjs \
            tests/customer-data-resolution-v28-integration.test.mjs \
            tests/whatsapp-chat-read-persistence-v22.test.mjs \
            docs/PANEL_CALL_DROPI_SAFETY_FREEZE_V21_20260817.md \
            docs/TEX_ULTRA_ENTRY_UNREAD_FREEZE_V22_20260818.md \
            docs/EC_ANA_IDENTITY_FREEZE_V23_20260818.md \
            docs/BUY_LATER_DATE_REMINDER_FREEZE_V24_20260818.md \
            docs/TEX_ULTRA_ENTRY_INTERRUPT_FREEZE_V25_20260818.md \
            docs/TEX_ULTRA_STRONG_INTENT_FREEZE_V26_20260818.md \
            docs/TEX_ULTRA_VSL_PAYLOAD_FREEZE_V27_20260818.md \
            docs/CUSTOMER_IDENTITY_LOCATION_DELIVERY_FREEZE_V28_20260818.md \
            docs/freeze/panel-call-dropi-safety-v21-20260817.json \
            docs/freeze/tex-ultra-entry-unread-v22-20260818.json \
            docs/freeze/ec-ana-identity-v23-20260818.json \
            docs/freeze/buy-later-date-reminder-v24-20260818.json \
            docs/freeze/tex-ultra-entry-interrupt-v25-20260818.json \
            docs/freeze/tex-ultra-strong-intent-v26-20260818.json \
            docs/freeze/tex-ultra-vsl-payload-v27-20260818.json \
            docs/freeze/customer-data-resolution-v28-20260818.json \
            extensions/vitalismen-whatsapp-official/legacy-funnel-library.js

      - name: Validate customer intelligence
        run: npm run test:customer-form

      - name: Validate manual funnel and historical order policy
        run: npm run test:manual-funnel

      - name: Validate authenticated funnel metrics
        run: npm run test:funnel-metrics

      - name: Preserve product, country and approved freeze layers
        shell: bash
        env:
          CI: 'true'
          GITHUB_ACTIONS: 'true'
        run: |
          test "$GITHUB_REPOSITORY" = "GitViltaliesmen/vitalismen-maxlien-painel"
          test "$(realpath "$PWD")" = "$(realpath "$GITHUB_WORKSPACE")"
          cp -- .env.example .env
          cleanup() { rm -f -- .env; }
          trap cleanup EXIT
          npm run guard:ec-product-micro-layer
          npm run guard:ec-tex-ultra
          npm run guard:freeze-lock
          node --test tests/review-v17-v19-p1.test.mjs tests/senior-guard-github-actions.test.mjs
          npm run senior:check

      - name: Confirm temporary environment cleanup
        if: always()
        shell: bash
        run: test ! -e .env

      - name: Reject whitespace errors
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA"...HEAD
          else
            git show --check --oneline HEAD
          fi
