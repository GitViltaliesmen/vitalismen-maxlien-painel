name: EC panel quality gate

on:
  pull_request:
    paths:
      - public/qr.html
      - public/panel-intelligence/**
      - scripts/audit-ec-panel-smart-customer.mjs
      - scripts/audit-ec-tex-ultra-isolation.mjs
      - tests/customer-form-intelligence.test.cjs
      - package.json
      - .github/workflows/ec-panel-quality.yml
  push:
    branches:
      - main
      - codex/**
    paths:
      - public/qr.html
      - public/panel-intelligence/**
      - scripts/audit-ec-panel-smart-customer.mjs
      - scripts/audit-ec-tex-ultra-isolation.mjs
      - tests/customer-form-intelligence.test.cjs
      - package.json
      - .github/workflows/ec-panel-quality.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec-panel-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-form:
    name: Customer form, Ecuador-only and Tex Ultra (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Verify tracked audit inputs
        shell: bash
        run: |
          git ls-files --error-unmatch \
            public/qr.html \
            public/panel-intelligence/customer-data-normalizer.js \
            public/panel-intelligence/conversation-data-extractor.js \
            public/panel-intelligence/agency-catalog.js \
            public/panel-intelligence/customer-form-intelligence.js \
            scripts/audit-ec-panel-smart-customer.mjs \
            tests/customer-form-intelligence.test.cjs

      - name: Run deterministic customer-form tests
        run: npm run test:customer-form

      - name: Preserve Tex Ultra approved layer
        run: node scripts/audit-ec-tex-ultra-isolation.mjs

      - name: Reject whitespace errors
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA"...HEAD
          else
            git show --check --oneline HEAD
          fi
