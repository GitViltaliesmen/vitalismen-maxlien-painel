# PROJECT=VITALISMEN_EC. Same-origin Tex Ultra web chat only.
location = /api/public/tex-ultra-chat {
    if ($request_method != POST) { return 405; }
    if ($http_origin !~ "^https://(www\.)?plusmen\.shop$") { return 403; }
    client_max_body_size 4k;
    client_body_timeout 10s;
    proxy_pass https://ec.maxlien.shop/api/web-chat/vitpower;
    proxy_ssl_server_name on;
    proxy_ssl_name ec.maxlien.shop;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    proxy_set_header Host ec.maxlien.shop;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Vitalismen-Chat-Page plusmen-tex-v240;
    proxy_set_header X-Vitalismen-Chat-Proxy __TEX_PROXY_SECRET__;
    proxy_set_header X-Vitalismen-Chat-QA $http_x_vitalismen_chat_qa;
    proxy_set_header X-Vitalismen-Chat-IP $remote_addr;
    proxy_next_upstream off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
