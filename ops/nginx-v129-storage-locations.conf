# Include inside the official ec.maxlien.shop TLS server only after STORAGE approval.
# Stable URLs must survive a rollback to an older application release.
location ^~ /media/uploads/ {
    alias /opt/vitalismen-automacao/shared/media/uploads/;
    autoindex off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /media/remote-cache/ {
    alias /opt/vitalismen-automacao/shared/runtime/remote-media-cache/;
    autoindex off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
