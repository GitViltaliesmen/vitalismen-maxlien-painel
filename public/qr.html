<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect WhatsApp Bot</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f0f2f5;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
            color: #333;
        }

        #status {
            margin-bottom: 1rem;
            font-weight: bold;
            color: #555;
        }

        #qrcode {
            margin-top: 1rem;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🤖 MaxTourus Bot Config</h1>
        <div id="status">Checking status...</div>
        <div class="loader" id="loader"></div>
        <img id="qrcode" src="" alt="Scan QR Code" width="300" height="300">
        <p id="instruction" style="display:none; color: #666; margin-top: 10px;">Open WhatsApp on your phone > Menu >
            Linked Devices > Link a Device</p>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const qrImg = document.getElementById('qrcode');
        const loader = document.getElementById('loader');
        const instruction = document.getElementById('instruction');

        async function checkStatus() {
            try {
                const ts = Date.now();
                const res = await fetch(`/api/whatsapp/status?_=${ts}`);
                const data = await res.json();

                statusEl.textContent = `Status: ${data.status.toUpperCase()} (Last updated: ${new Date().toLocaleTimeString()})`;

                if (data.status === 'connected') {
                    qrImg.style.display = 'none';
                    loader.style.display = 'none';
                    statusEl.style.color = 'green';
                    instruction.style.display = 'none';
                } else if (data.status === 'logged_out') {
                    qrImg.style.display = 'none';
                    loader.style.display = 'none';
                    statusEl.style.color = 'red';
                    statusEl.textContent = 'Status: LOGGED_OUT. Apague auth_info_baileys e reinicie o servidor para gerar um novo QR.';
                    instruction.style.display = 'none';
                } else if (data.qrCode) {
                    qrImg.src = data.qrCode;
                    qrImg.style.display = 'block';
                    loader.style.display = 'none';
                    instruction.style.display = 'block';
                    statusEl.style.color = '#e67e22'; // Orange for action needed
                } else {
                    qrImg.style.display = 'none';
                    loader.style.display = 'block';
                    statusEl.style.color = '#333';
                }
            } catch (e) {
                console.error(e);
                statusEl.textContent = `Error connecting to server... (${e.message})`;
                statusEl.style.color = 'red';
            }
        }

        // Check every 2 seconds
        setInterval(checkStatus, 2000);
        checkStatus();
    </script>
</body>

</html>
