                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </section>
                        <div class="dropi-product-summary" data-dropi-product-summary>Escolha o produto e o preco.</div>
                    </div>
                    <div class="dropi-product-actions">
                        <button data-dropi-product-close="1" type="button">Cancelar</button>
                        <button class="success-action" data-dropi-product-save="${escapeHtml(adminLeadId)}" type="button" disabled>Salvar produto/preco</button>
                    </div>
                </div>
            `;

            const syncSelection = () => {
                modal.querySelectorAll('[data-dropi-product-key]').forEach((button) => {
                    button.classList.toggle('selected', button.dataset.dropiProductKey === selection.productKey);
                });
                modal.querySelectorAll('[data-dropi-price-catalog]').forEach((button) => {
                    button.classList.toggle(
                        'selected',
                        button.dataset.dropiPriceCatalog === selection.priceCatalog
                            && Number(button.dataset.dropiQuantity) === Number(selection.quantity)
                    );
                });
                const total = DROPI_EC_PRICE_CATALOGS[selection.priceCatalog]?.[selection.quantity];
                const product = products.find((item) => item.key === selection.productKey);
                const ready = Boolean(product && Number.isFinite(total));
                const summary = modal.querySelector('[data-dropi-product-summary]');
                const save = modal.querySelector('[data-dropi-product-save]');
                summary.classList.toggle('ready', ready);
                summary.textContent = ready
                    ? `${DROPI_EC_PRODUCT_NAMES[product.key] || product.name} · ${selection.quantity} unidade(s) · USD ${Number(total).toFixed(2)} · ${selection.priceCatalog === 'promotional' ? 'promocional' : 'normal'}${product.dropiEnabled ? '' : ' · envio bloqueado ate validar o produto na Dropi'}`
                    : 'Escolha o produto e o preco.';

            modal.addEventListener('click', async (event) => {
                if (event.target === modal || event.target.closest('[data-dropi-product-close]')) {
                    closeDropiProductModal();

                const productButton = event.target.closest('[data-dropi-product-key]');
                if (productButton) {
                    selection.productKey = productButton.dataset.dropiProductKey || '';

                const priceButton = event.target.closest('[data-dropi-price-catalog]');
                if (priceButton) {
                    selection.priceCatalog = priceButton.dataset.dropiPriceCatalog || '';
                    selection.quantity = Number(priceButton.dataset.dropiQuantity || 0);

                const saveButton = event.target.closest('[data-dropi-product-save]');

                saveButton.disabled = true;
                saveButton.textContent = 'Salvando...';
                try {
                    const result = await api(`/api/shipments/droppi/ec/admin-leads/${encodeURIComponent(adminLeadId)}/configure-order`, {
                        method: 'POST',
                        body: JSON.stringify({
                            orderId: leadOrderId(lead),
                            productKey: selection.productKey,
                            priceCatalog: selection.priceCatalog,
                            quantity: selection.quantity
                        })
                    });
                    const offer = result.offer || {};
                    const marker = `[DROPI_PRODUCT] key=${offer.productKey}; name=${offer.productName}; priceCatalog=${offer.priceCatalog}; quantity=${offer.quantity}; total=${Number(offer.total).toFixed(2)}`;
                    lead.notes = `${String(lead.notes || '').replace(/(?:^|\n)\[DROPI_PRODUCT\][^\r\n]*/gi, '').trim()}${lead.notes ? '\n' : ''}${marker}`.trim();
                    lead.productKey = offer.productKey;
                    lead.productName = offer.productName;
                    lead.priceCatalog = offer.priceCatalog;
                    lead.quantity = offer.quantity;
                    lead.value = offer.total;
                    lead._ops = {
                        ...(lead._ops || {}),
                        currentOrderId: result.orderId,
                        stagedOrderId: result.orderId,
                        productKey: offer.productKey,
                        productName: offer.productName,
                        priceCatalog: offer.priceCatalog,
                        productSelection: offer
                    };
                    state.dropiMessages.set(id, {
                        text: result.dropiEnabled
                            ? 'produto/preco salvo; autorize o pedido'
                            : 'produto/preco salvo; produto ainda nao validado na Dropi',
                        error: !result.dropiEnabled,
                        success: Boolean(result.dropiEnabled)

                    closeDropiProductModal();
                    render();

                    state.dropiMessages.set(id, { text: error.message || 'erro ao configurar produto/preco', error: true });

        const render = () => {
            const leads = visibleLeads();
            el('countText').textContent = `${leads.length} cliente${leads.length === 1 ? '' : 's'}`;
            el('updatedAt').textContent = `atualizado ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
            el('subtitle').textContent = `Fonte unica: Leads Clientes ${state.country}`;
            el('modeText').textContent = hasSearch()
                ? 'Busca historica ativa'
                : state.dateFilter === 'today'
                    ? 'Atendidos/salvos hoje'
                    : state.dateFilter === '7d'
                        ? 'Atendidos/salvos 7 dias'

            if (state.loadError) {

            el('leadRows').innerHTML = leads.map((lead) => `
                <tr data-lead-row="${escapeHtml(lead.id)}">

                    <td>
                        <div class="lead-name">
                            <strong>${escapeHtml(lead.name || '')}</strong>
                            <span class="lead-date">${escapeHtml(formatLeadDate(lead))}${hasSearch() && isHistoricalLead(lead) ? ' · historico' : ''}</span>
                            ${purchaseCountLabel(lead) ? `<span class="lead-date">${escapeHtml(purchaseCountLabel(lead))}</span>` : ''}
                            ${leadProductBadgeHtml(lead)}
                            ${metaPurchaseBadgeHtml(lead)}
                        </div>

                    <td class="addr"><div class="addr-text">${escapeHtml(lead.address || '')}</div></td>

                    <td>
                        <div class="lead-controls">
                            ${leadStatusControlHtml(lead)}

        };

        const askFollowupAt = () => {
            const now = new Date();
            now.setDate(now.getDate() + 4);
            const pad = (value) => String(value).padStart(2, '0');
            return window.prompt('Data desejada de compra/envio (DD-MM-AAAA HH:MM). O aviso unico sera enviado entre 4 e 3 dias antes:', `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()} 09:00`) || '';
        };

        const parseFollowup = (value) => {
            const match = String(value || '').trim().match(/^(\d{2})-(\d{2})-(\d{4})\s+(\d{2}):(\d{2})$/);
            if (!match) return '';
            return `${match[3]}-${match[2]}-${match[1]}T${match[4]}:${match[5]}:00-05:00`;
        };

        const saveStatus = async (select) => {
            const id = select.dataset.leadStatus;
            const country = select.dataset.country || state.country;
            const status = select.value;
            const msg = document.querySelector(`[data-status-msg="${CSS.escape(id)}"]`);
            const previous = select.dataset.prev || 'novo';
            const previousOperationalStatus = normalizePanelStatus(previous);
            const lead = state.leads.find((item) => String(item.id) === String(id));
            const adminOrderId = lead ? leadOrderId(lead) : '';
            const shouldStageOperationalConfirmed = lead
                && status === 'confirmado'
                && hasAuthToken()
                && /^EC-ADMIN-\d+$/i.test(adminOrderId);
            if (lead && status === 'confirmado' && isManualReviewLead(lead)) {
                select.value = previous;
                setStatusClass(select);
                if (msg) msg.textContent = 'use Enviar agencia';
                window.alert('Este pedido precisa de ajuste de agencia/cidade. Use Enviar agencia ou corrija o destino antes de confirmar novamente.');
                return;
            }
            let followupAt = '';
            if (status === 'comprar_depois') {
                followupAt = parseFollowup(askFollowupAt());
                if (!followupAt) {
                    select.value = previous;
                    setStatusClass(select);
                    if (msg) msg.textContent = 'data invalida';
                    return;
                }
            }
            setStatusClass(select);
            select.disabled = true;
            if (msg) {
                msg.className = 'saved';
                msg.textContent = 'salvando';
            }
            try {
                if (shouldStageOperationalConfirmed) {
                    const result = await api(`/api/shipments/droppi/ec/admin-leads/${encodeURIComponent(id)}/stage-confirmed`, {
                        method: 'POST',
                        body: JSON.stringify({
                            note: 'Confirmado pelo seletor em Leads Clientes',
                            forceRepurchase: previousOperationalStatus === 'entregue'
                                || isHistoricalLead({ ...lead, status: previousOperationalStatus, _opsStatus: previousOperationalStatus })
                                || isRepurchaseLead(lead)
                        })
                    });
                    select.dataset.prev = 'confirmado';
                    lead.status = 'confirmado';
                    lead._opsStatus = 'confirmado';
                    lead._ops = {
                        ...(lead._ops || {}),
                        repurchase: Boolean(result.repurchase),
                        stagedOrderId: result.orderId,
                        currentOrderId: result.orderId
                    };
                    state.dropiMessages.set(id, { text: result.message || 'em confirmados', error: false, success: true });
                    notifyIntegratedPanelStatus(lead, 'confirmado');
                    if (msg) msg.textContent = 'salvo';
                    await fetchLeads();
                    return;
                }

                const response = await fetch(`${adminApiBase}/admin/api/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ id, country, status, followup_at: followupAt })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.ok) throw new Error(data.error || `Erro ${response.status}`);
                select.dataset.prev = status;
                const lead = state.leads.find((item) => String(item.id) === String(id));
                if (lead) {
                    lead.status = status;
                    lead._opsStatus = status;
                    if (status === 'comprar_depois') {
                        lead.buy_later_followup_at = followupAt;
                        lead.buy_later_notified_at = '';
                    }
                    const integratedSync = await syncIntegratedPanelOrderStatus(lead, status);
                    notifyIntegratedPanelStatus(lead, status);
                    if (integratedSync?.error && msg) {
                        msg.className = 'saved error';
                        msg.textContent = 'lead salvo; painel integrado pendente';
                        return;
                    }
                }
                if (msg) msg.textContent = 'salvo';
                render();
            } catch (error) {
                select.value = previous;
                setStatusClass(select);
                if (msg) {
                    msg.className = 'saved error';
                    msg.textContent = error.message || 'erro';
                }
            } finally {
                select.disabled = false;
            }
        };

        const confirmLeadCustomerData = async (button) => {
            const id = String(button.dataset.confirmLead || '');
            const country = button.dataset.country || state.country;
            const lead = state.leads.find((item) => String(item.id) === id);
            if (!lead || !leadReadyForCustomerConfirmation(lead)) return;
            const repurchaseCandidate = isHistoricalLead(lead) || statusValue(lead) === 'entregue' || isRepurchaseLead(lead);
            const confirmText = repurchaseCandidate
                ? 'Colocar este cliente em Pedidos Confirmados como pedido operacional novo? Ele nao sera enviado para Dropi ate voce autorizar.'
                : 'Confirmar dados deste cliente e mover para Confirmado?';
            if (!window.confirm(confirmText)) return;
            const busyKey = `confirm-${id}`;
            state.dropiBusy.add(busyKey);
            state.dropiMessages.set(id, { text: 'colocando em confirmados...', error: false });
            render();
            try {
                if (hasAuthToken()) {
                    const result = await api(`/api/shipments/droppi/ec/admin-leads/${encodeURIComponent(id)}/stage-confirmed`, {
                        method: 'POST',
                        body: JSON.stringify({
                            note: 'Confirmado em Leads Clientes',
                            forceRepurchase: repurchaseCandidate
                        })
                    });
                    lead.status = 'confirmado';
                    lead._opsStatus = 'confirmado';
                    lead._ops = {
                        ...(lead._ops || {}),
                        repurchase: Boolean(result.repurchase),
                        stagedOrderId: result.orderId
                    };
                    state.dropiMessages.set(id, { text: result.message || 'em confirmados', error: false, success: true });
                    notifyIntegratedPanelStatus(lead, 'confirmado');
                    await fetchLeads();
                    return;
                }

                const response = await fetch(`${adminApiBase}/admin/api/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ id, country, status: 'confirmado' })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.ok) throw new Error(data.error || `Erro ${response.status}`);
                lead.status = 'confirmado';
                await syncIntegratedPanelOrderStatus(lead, 'confirmado');
                notifyIntegratedPanelStatus(lead, 'confirmado');
                state.status = state.status === 'novo' ? '' : state.status;
                render();
            } catch (error) {
                state.dropiMessages.set(id, { text: error.message || 'erro ao confirmar', error: true });
                render();
            } finally {
                state.dropiBusy.delete(busyKey);
                render();
            }
        };

        const markAbandonedLeadAsAttending = async (button) => {
            const id = String(button.dataset.abandonLead || '');
            const country = button.dataset.country || state.country;
            const lead = state.leads.find((item) => String(item.id) === id);
            if (!lead) return;
            if (!window.confirm('Mover este cliente de abandono para Atendendo?')) return;
            state.dropiBusy.add(`abandon-${id}`);
            render();
            try {
                const response = await fetch(`${adminApiBase}/admin/api/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ id, country, status: 'atendendo' })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.ok) throw new Error(data.error || `Erro ${response.status}`);
                lead.status = 'atendendo';
                notifyIntegratedPanelStatus(lead, 'atendendo');
                render();

                state.dropiMessages.set(id, { text: error.message || 'erro ao retomar', error: true });
                render();

                state.dropiBusy.delete(`abandon-${id}`);
                render();
            }
        };

        const submitLeadToDropi = async (lead, overrideOrderId = '') => {
            const id = String(lead.id);
            const orderId = overrideOrderId || leadOrderId(lead);
            const setMsg = (text, error = false, success = false) => {
                state.dropiMessages.set(id, { text, error, success });
                const msg = document.querySelector(`[data-dropi-msg="${CSS.escape(id)}"]`);
                if (msg) {
                    msg.textContent = text;
                    msg.className = `action-message${error ? ' error' : ''}${success ? ' success' : ''}`;
                }
            };
            if (!hasAuthToken()) {
                setMsg('entre no painel integrado', true);
                render();
                return;
            }
            state.dropiBusy.add(String(id));
            render();

            const sleep = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));
            const readDropiSubmitStatus = async () => api(`/api/shipments/droppi/ec/orders/${encodeURIComponent(orderId)}/submit-status`);
            const isVerifiedDropiSubmission = (result = {}) => Boolean(
                result.alreadySubmitted
                || result.status === 'submitted'
                || result.dropiOrderId
                || result.trackingNumber
                || result.shipment?.raw?.droppiOrder?.id
                || result.shipment?.raw?.droppiOrder?.order_id
                || result.shipment?.raw?.manualDropiOrderId
                || result.shipment?.raw?.latestDroppiPayload?.dropiOrderId
                || result.shipment?.raw?.latestDroppiPayload?.trackingNumber
                || result.shipment?.logistics?.trackingNumber
            );
            const waitDropiSubmitResult = async () => {
                const startedAt = Date.now();
                const maxWaitMs = 9 * 60 * 1000;
                while ((Date.now() - startedAt) < maxWaitMs) {
                    await sleep(15000);
                    const status = await readDropiSubmitStatus();
                    if (status.alreadySubmitted || status.status === 'submitted') return status;
                    if (status.paymentRequired || status.authRequired || status.manualSendRequired || status.authorizationRequired) return status;
                    setMsg(status.message || 'processando na Dropi');
                }
                return {
                    processing: true,
                    submitQueued: true,
                    message: 'Dropi ainda esta processando. Atualize em instantes.'
                };
            };
            const applyDropiSubmitResult = (result = {}) => {
                if (result.paymentRequired) {
                    setMsg('sem saldo Dropi', true);
                    return;
                }
                if (result.authRequired) {
                    setMsg(result.message || 'sessao Dropi/2FA', true);
                    return;
                }
                if (result.authorizationRequired) {
                    setMsg(result.message || 'autorize antes de enviar', true);
                    return;
                }
                if (result.manualSendRequired) {
                    setMsg(result.message || 'revisar manual', true);
                    return;
                }
                if (result.processing) {
                    setMsg(result.message || 'processando na Dropi', true);
                    return;
                }
                if (isVerifiedDropiSubmission(result)) {
                    lead.status = 'pedido_enviado';
                    lead._opsStatus = 'pedido_enviado';
                    state.selectedDropi.delete(String(id));
                    state.dropiMessages.delete(id);
                    notifyIntegratedPanelStatus(lead, 'pedido_enviado');
                    syncIntegratedPanelOrderStatus(lead, 'pedido_enviado').catch(() => null);
                    setMsg(result.alreadySubmitted ? 'ja enviado' : 'enviado', false, true);
                    return;
                }
                setMsg(result.message || 'Dropi sem confirmacao. Confira antes de marcar enviado.', true);
            };

            try {
                setMsg('verificando autorizacao...');
                const status = await readDropiSubmitStatus().catch(() => null);
                if (status?.alreadySubmitted || status?.status === 'submitted' || status?.paymentRequired || status?.authRequired || status?.manualSendRequired || status?.processing) {
                    applyDropiSubmitResult(status);
                    return;
                }
                if (status?.authorizationRequired || status?.status === 'authorization_required') {
                    if (!window.confirm(`Autorizar ${orderId} para a etapa Enviar para Dropi?\n\nNada sera enviado agora. O envio real exige outro clique em Enviar para Dropi.`)) {
                        setMsg('aguardando autorizacao');
                        return;
                    }
                    setMsg('autorizando...');
                    await api(`/api/shipments/droppi/ec/orders/${encodeURIComponent(orderId)}/authorize-submit`, {
                        method: 'POST',
                        body: JSON.stringify({ note: overrideOrderId ? 'Autorizado em Leads Clientes - Recompra' : 'Autorizado em Leads Clientes' })
                    });
                    state.selectedDropi.delete(String(id));
                    setMsg('autorizado; clique novamente para enviar', false, true);
                    return;
                }
                setMsg('enviando...');
                let result = await api(`/api/shipments/droppi/ec/orders/${encodeURIComponent(orderId)}/submit`, {
                    method: 'POST',
                    body: JSON.stringify({ async: true })
                });
                if (result.submitQueued || result.processing) {
                    setMsg('processando na Dropi');
                    result = await waitDropiSubmitResult();
                }
                applyDropiSubmitResult(result);
            } catch (error) {
                if (error.status === 504 || /Erro 504/i.test(error.message || '')) {
                    setMsg('Dropi demorou. Conferindo envio...');
                    const result = await waitDropiSubmitResult();
                    applyDropiSubmitResult(result);
                } else {
                    setMsg(error.message || 'erro Dropi', true);
                }
            } finally {
                state.dropiBusy.delete(String(id));
                render();
            }
        };

        const authorizeRepurchaseDropi = async (button, { skipConfirm = false } = {}) => {
            const id = String(button.dataset.authorizeRepurchaseDropi || '');
            const lead = state.leads.find((item) => String(item.id) === id);
            if (!lead) return;
            if (!leadReadyForCustomerConfirmation(lead)) {
                state.dropiMessages.set(id, { text: 'complete os dados antes', error: true });
                render();
                return;
            }
            const currentOrderId = lead?._ops?.currentOrderId || lead?._ops?.stagedOrderId || '';
            if (currentOrderId) {
                if (!skipConfirm && !window.confirm(`Enviar o pedido atual ${currentOrderId} para Dropi?`)) return;
                state.dropiBusy.add(id);
                state.dropiMessages.set(id, { text: 'enviando pedido atual...', error: false });
                render();
                try {
                    await submitLeadToDropi(lead, currentOrderId);
                    await fetchLeads();
                } catch (error) {
                    state.dropiMessages.set(id, { text: error.message || 'erro ao enviar pedido atual', error: true });
                    render();
                } finally {
                    state.dropiBusy.delete(id);
                    render();
                }
                return;
            }
            if (!skipConfirm && !window.confirm('Autorizar envio de novo pedido Dropi para este cliente? O historico anterior sera fechado quando houver evidencia de retirada/Dropi, para evitar duplicidade.')) return;
            state.dropiBusy.add(id);
            state.dropiMessages.set(id, { text: 'autorizando novo pedido...', error: false });
            render();
            try {
                const result = await api(`/api/shipments/droppi/ec/admin-leads/${encodeURIComponent(id)}/authorize-repurchase`, {
                    method: 'POST',
                    body: JSON.stringify({ note: 'Autorizado em Leads Clientes' })
                });
                state.dropiMessages.set(id, { text: result.message || 'novo pedido autorizado; clique novamente para enviar', error: false, success: true });
                state.selectedDropi.delete(id);
                await fetchLeads();
            } catch (error) {
                state.dropiMessages.set(id, { text: error.message || 'erro no novo pedido', error: true });
                render();
            } finally {
                state.dropiBusy.delete(id);
                render();
            }
        };

        const submitDropiFromButton = async (button) => {

            const lead = state.leads.find((item) => String(item.id) === id);
            if (!lead) return;
            if (!leadReadyForCustomerConfirmation(lead)) {
                state.dropiMessages.set(id, { text: 'complete os dados antes', error: true });
                render();
                return;
            }
            await submitLeadToDropi(lead);
            await fetchLeads();
        };

        const authorizeResendDropi = async (button, { skipConfirm = false } = {}) => {
            const id = String(button.dataset.authorizeResendDropi || '');
            const lead = state.leads.find((item) => String(item.id) === id);
            if (!lead) return;
            if (!leadReadyForCustomerConfirmation(lead)) {
                state.dropiMessages.set(id, { text: 'complete os dados antes', error: true });

        const openManualDropiLink = async (button) => {

            if (!lead) return;
            const orderId = leadOrderId(lead);

            try {

                if (result.copyText && navigator.clipboard?.writeText) {

        const finalizeHistoricalLead = async (button) => {

            if (!lead) return;

            state.dropiBusy.add(id);

                render();

        const sendLeadToDropiFromSelection = async (lead) => {
            const id = String(lead?.id || '');

            if (leadReadyForDropi(lead)) {
                await submitLeadToDropi(lead);
                return;
            }
            if (isRepurchaseLead(lead)) {
                await authorizeRepurchaseDropi({ dataset: { authorizeRepurchaseDropi: id } }, { skipConfirm: true });
                return;
            }
            if (isManualReviewLead(lead) || isResendCandidateLead(lead) || isConfirmedBeforeJune2026(lead)) {
                await authorizeResendDropi({ dataset: { authorizeResendDropi: id } }, { skipConfirm: true });
                return;
            }
            await submitLeadToDropi(lead);
        };

        const sendSelectedDropi = async () => {
            const selectedLeads = [...state.selectedDropi]
                .map((id) => state.leads.find((lead) => String(lead.id) === String(id)))
                .filter((lead) => lead && leadSelectableForDropi(lead));
            const leadsToSend = selectedLeads.length
                ? selectedLeads
                : visibleLeads().filter((lead) => leadSelectableForDropi(lead) && !state.dropiBusy.has(String(lead.id)));
            if (!leadsToSend.length) {
                window.alert('Nenhum pedido confirmado e completo visivel para enviar.');
                return;
            }
            const orderIds = leadsToSend.map(leadOrderId);
            const scopeLabel = selectedLeads.length ? 'marcado(s)' : 'visivel(is)';
            if (!window.confirm(`Enviar ${orderIds.length} pedido(s) ${scopeLabel} ja autorizado(s) para Dropi?\n\nPedido sem autorizacao previa sera apenas autorizado e vai exigir outro clique para envio real.\n\n${orderIds.join('\n')}`)) return;
            el('bulkDropiSendBtn').disabled = true;
            el('bulkDropiSendBtn').textContent = 'Processando...';
            for (const lead of leadsToSend) {
                await sendLeadToDropiFromSelection(lead);
                await new Promise((resolve) => window.setTimeout(resolve, 4000));
            }
            el('bulkDropiSendBtn').textContent = 'Enviar marcados para Dropi';
            await fetchLeads();
        };

        const setCountry = (country) => {
            state.country = 'EC';
            state.dropiCatalog = null;
            loadRepurchaseChecked();
            el('countryFilter').value = state.country;
            el('newLeadBtn').href = `${apiBase}/admin/new?country=EC`;
            const nextUrl = new URL(window.location.href);
            nextUrl.searchParams.set('country', state.country);
            window.history.replaceState({}, '', nextUrl);
            fetchLeads().catch((error) => {
                state.loadError = error.message;
                render();
            });
        };

        const deleteLead = async (button) => {
            const id = String(button.dataset.deleteLead || '');
            const lead = state.leads.find((item) => String(item.id) === id);
            if (!lead) return;
            const label = [lead.name, lead.phone].filter(Boolean).join(' / ') || `lead ${id}`;
            if (!window.confirm(`Excluir este pedido da lista?\n\n${label}`)) return;
            state.dropiBusy.add(`delete-${id}`);
            state.dropiMessages.set(id, { text: 'excluindo...', error: false });
            render();
            try {
                const form = new URLSearchParams();
                form.set('country', lead.country || state.country || 'EC');
                const response = await fetch(`${adminApiBase}/admin/delete/${encodeURIComponent(id)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    credentials: 'include',
                    body: form.toString()
                });
                if (!response.ok) throw new Error(`Erro ${response.status} ao excluir`);
                state.leads = state.leads.filter((item) => String(item.id) !== id);
                state.selectedDropi.delete(id);
                state.dropiMessages.delete(id);
                await fetchLeads();
            } catch (error) {
                state.dropiMessages.set(id, { text: error.message || 'erro ao excluir', error: true });
                render();

                state.dropiBusy.delete(`delete-${id}`);
                render();
            }
        };

        state.dateFilter = el('dateFilter').value;
        el('newLeadBtn').href = `${apiBase}/admin/new?country=EC`;
        setupStatusFilter();

            if (!option) return;
            el('statusFilterControl').classList.remove('open');
            setStatusFilterValue(option.dataset.statusFilterOption || '');
        });
        document.addEventListener('click', (event) => {
            if (el('statusFilterControl').contains(event.target)) return;
            el('statusFilterControl').classList.remove('open');
            syncStatusFilterControl();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') return;
            el('statusFilterControl').classList.remove('open');

            if (checkbox) {
                const id = String(checkbox.dataset.dropiSelect || '');

                else state.selectedDropi.delete(id);
                updateBulkDropiBar();

        el('leadRows').addEventListener('click', (event) => {

            if (button) {
                confirmLeadCustomerData(button);

            const abandonButton = event.target.closest('[data-abandon-lead]');
            if (abandonButton) {

                return;
            }
            const repurchaseButton = event.target.closest('[data-authorize-repurchase-dropi]');
            if (repurchaseButton) {
                authorizeRepurchaseDropi(repurchaseButton);
                return;
            }
            const configureProductButton = event.target.closest('[data-configure-dropi-product]');
            if (configureProductButton) {
                const id = String(configureProductButton.dataset.configureDropiProduct || '');
                const lead = state.leads.find((item) => String(item.id) === id);

        window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin) return;
            const country = event.data?.country;
            if (event.data?.type === 'vitalismen:set-leads-country' && country) setCountry(country);
            if (event.data?.type === 'vitalismen:refresh-leads') {

            else fetchLeads().catch((error) => {
                state.loadError = error.message;
                render();
            });

            state.loadError = error.message;
            render();
            el('updatedAt').textContent = 'erro';
